<text x="83" y="283" font-family="Arial,sans-serif" font-size="16" letter-spacing="2" fill="#9b4530">WEEK 01</text>
<text x="83" y="354" font-family="Georgia,serif" font-size="31" fill="#182e66"><tspan x="83">Introduce</tspan><tspan x="83" dy="46">the offer.</tspan></text>
