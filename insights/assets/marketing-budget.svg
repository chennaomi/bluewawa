<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Define the scope. Then the spend.</title><desc id="desc">A budget separates service work, production and distribution before a total is agreed.</desc>
<rect width="1200" height="630" fill="#e6dfd0"/>
<text x="60" y="65" font-family="Arial,sans-serif" font-size="17" fill="#182e66" letter-spacing="4">BLUEWAWA FIELD GUIDE / 07</text>
<path d="M60 90H1140" stroke="#182e66" stroke-opacity=".2"/>
<text x="60" y="177" font-family="Georgia,serif" font-size="51" fill="#182e66">Define the scope. Then the spend.</text>
<rect x="60" y="240" width="350" height="280" rx="3" fill="#faf6ee"/>
<text x="83" y="283" font-family="Arial,sans-serif" font-size="16" letter-spacing="2" fill="#9b4530">01 / SERVICES</text>
<text x="83" y="354" font-family="Georgia,serif" font-size="36" fill="#182e66"><tspan x="83">Plan, coordinate</tspan><tspan x="83" dy="46">and review.</tspan></text>
<path d="M83 439H387" stroke="#182e66" stroke-opacity=".25"/>
<text x="83" y="482" font-family="Arial,sans-serif" font-size="16" fill="#596171">Owners + scope + time</text>
<rect x="425" y="240" width="350" height="280" rx="3" fill="#faf6ee"/>
<text x="448" y="283" font-family="Arial,sans-serif" font-size="16" letter-spacing="2" fill="#9b4530">02 / PRODUCTION</text>
<text x="448" y="354" font-family="Georgia,serif" font-size="36" fill="#182e66"><tspan x="448">Make the</tspan><tspan x="448" dy="46">content useful.</tspan></text>
<path d="M448 439H752" stroke="#182e66" stroke-opacity=".25"/>
<text x="448" y="482" font-family="Arial,sans-serif" font-size="16" fill="#596171">Formats + assets + edits</text>
<rect x="790" y="240" width="350" height="280" rx="3" fill="#182e66"/>
<text x="813" y="283" font-family="Arial,sans-serif" font-size="16" letter-spacing="2" fill="#ffce06">03 / DISTRIBUTION</text>
<text x="813" y="354" font-family="Georgia,serif" font-size="36" fill="#faf6ee"><tspan x="813">Price each</tspan><tspan x="813" dy="46">route separately.</tspan></text>
<path d="M813 439H1117" stroke="#faf6ee" stroke-opacity=".25"/>
<text x="813" y="482" font-family="Arial,sans-serif" font-size="16" fill="#faf6ee">Creators + paid media</text>
<text x="60" y="583" font-family="Arial,sans-serif" font-size="17" fill="#596171">A Bluewawa planning framework. Adapt to your audience and operating scope.</text>
</svg>
