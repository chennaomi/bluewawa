<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">From search to a useful answer.</title><desc id="desc">A customer question becomes a documented observation and then a focused content brief.</desc>
<rect width="1200" height="630" fill="#e6dfd0"/>
<text x="60" y="65" font-family="Arial,sans-serif" font-size="17" fill="#182e66" letter-spacing="4">BLUEWAWA FIELD GUIDE / 04</text>
<path d="M60 90H1140" stroke="#182e66" stroke-opacity=".2"/>
<text x="60" y="177" font-family="Georgia,serif" font-size="51" fill="#182e66">From search to a useful answer.</text>
<rect x="60" y="240" width="349.3333333333333" height="280" rx="3" fill="#faf6ee"/>
<text x="83" y="283" font-family="Arial,sans-serif" font-size="16" letter-spacing="2" fill="#9b4530">01 / QUESTION</text>
<text x="83" y="354" font-family="Georgia,serif" font-size="36" fill="#182e66"><tspan x="83">What does the</tspan><tspan x="83" dy="46">reader need?</tspan></text>
<path d="M83 439H386.3333333333333" stroke="#182e66" stroke-opacity=".25"/>
<text x="83" y="482" font-family="Arial,sans-serif" font-size="16" fill="#596171">Audience + decision</text>
<rect x="425.3333333333333" y="240" width="349.3333333333333" height="280" rx="3" fill="#faf6ee"/>
<text x="448.3333333333333" y="283" font-family="Arial,sans-serif" font-size="16" letter-spacing="2" fill="#9b4530">02 / EVIDENCE</text>
<text x="448.3333333333333" y="354" font-family="Georgia,serif" font-size="36" fill="#182e66"><tspan x="448.3333333333333">What did you</tspan><tspan x="448.3333333333333" dy="46">actually observe?</tspan></text>
<path d="M448.3333333333333 439H751.6666666666666" stroke="#182e66" stroke-opacity=".25"/>
<text x="448.3333333333333" y="482" font-family="Arial,sans-serif" font-size="16" fill="#596171">Source + date + context</text>
<rect x="790.6666666666666" y="240" width="349.3333333333333" height="280" rx="3" fill="#182e66"/>
<text x="813.6666666666666" y="283" font-family="Arial,sans-serif" font-size="16" letter-spacing="2" fill="#ffce06">03 / BRIEF</text>
<text x="813.6666666666666" y="354" font-family="Georgia,serif" font-size="36" fill="#faf6ee"><tspan x="813.6666666666666">What can your</tspan><tspan x="813.6666666666666" dy="46">brand answer?</tspan></text>
<path d="M813.6666666666666 439H1117" stroke="#faf6ee" stroke-opacity=".25"/>
<text x="813.6666666666666" y="482" font-family="Arial,sans-serif" font-size="16" fill="#faf6ee">Facts + assets + next step</text>
<text x="60" y="583" font-family="Arial,sans-serif" font-size="17" fill="#596171">A Bluewawa planning framework. Adapt to your audience and operating scope.</text>
</svg>
